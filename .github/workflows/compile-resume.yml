name: Compile website resume

on:
  push:
    branches: [main]
    paths:
      - "resume/NehalChoudhary_Resume.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Compile resume
        run: |
          mkdir -p build/resume
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/resume resume/NehalChoudhary_Resume.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/resume resume/NehalChoudhary_Resume.tex
          cp build/resume/NehalChoudhary_Resume.pdf public/resumes/NehalChoudhary_Resume.pdf

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resumes/NehalChoudhary_Resume.pdf
          if git diff --cached --quiet; then
            echo "Resume PDF is already current."
            exit 0
          fi
          git commit -m "Compile website resume from LaTeX"
          git push
